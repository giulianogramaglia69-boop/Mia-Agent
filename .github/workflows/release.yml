name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: mia-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: mia-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: mia-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p mia-ui --bin mia
      - name: Prepare asset
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/mia"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          cp "$bin" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      # Linux: real installers — .rpm (Fedora/RHEL) and .AppImage.
      # The binary only links libc, but the GUI dlopens the graphics
      # stack at runtime; the .rpm Requires list covers it.
      - name: Build Linux installers (.rpm, .AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm -p crates/mia-ui --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/generate-rpm/*.rpm ./
          MIA_BIN="target/x86_64-unknown-linux-gnu/release/mia" ./packaging/build-appimage.sh 0.1.0
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: mia-agent-rpm
          path: "*.rpm"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: mia-agent-appimage
          path: "*.AppImage"
      # Windows: NSIS installer (.exe) — first launch opens Mia's own
      # in-app setup screen (no model configured yet).
      - name: Build Windows installer (.exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y
          cp "target/x86_64-pc-windows-msvc/release/mia.exe" packaging/windows/mia.exe
          cd packaging/windows
          "/c/Program Files (x86)/NSIS/makensis.exe" mia.nsi
          cp MiaAgent-0.1.0-Setup.exe ../..
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: mia-agent-setup
          path: "MiaAgent-*-Setup.exe"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
