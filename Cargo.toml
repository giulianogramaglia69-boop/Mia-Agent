[workspace]
members = ["crates/mia-core", "crates/mia-graph"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Giuliano Gramaglia"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
