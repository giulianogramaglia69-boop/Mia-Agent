[workspace]
members = ["crates/mia-core", "crates/mia-graph", "crates/mia-wiki", "crates/mia-runtime", "crates/mia-ui", "crates/mia-mcp", "crates/mia-google", "containers/mia-notes", "containers/mia-browser", "containers/mia-calendar", "containers/mia-mail"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Giuliano Gramaglia"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
tantivy = "0.22"
pulldown-cmark = "0.12"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
harness-rs-loop = "0.0.72"
harness-rs-core = "0.0.72"
harness-rs-context = "0.0.72"
harness-rs-models = "0.0.72"
sequoia-ui = "0.1.5"
sequoia-shader = "0.1.5"
harness-rs-mcp-client = "0.0.72"
rmcp = { version = "3.11.0", features = ["transport-io"] }
schemars = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
